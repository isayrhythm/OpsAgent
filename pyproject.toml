[project]
name = "opsagent"
version = "0.1.0"
description = "LangGraph Agent + Skill execution system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
api = "uvicorn backend.app.main:app --reload --host 127.0.0.1 --port 8001"
web = "python -m http.server 5173 -d frontend"
check = "python -m compileall backend"
